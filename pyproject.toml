[build-system]
requires = ["setuptools>=75.0", "wheel>=0.44"]
build-backend = "setuptools.build_meta"


[project]
name = "energy-operations-intelligence-platform"
version = "0.1.0"
description = "A consultant-level end-to-end energy analytics and decision-support platform for utility-scale solar operations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Portfolio and educational use" }
authors = [
    { name = "Energy Analytics Consultant" },
]
keywords = [
    "energy-analytics",
    "solar-energy",
    "scada",
    "predictive-maintenance",
    "time-series",
    "streamlit",
    "machine-learning",
]

dependencies = [
    "fastapi",
    "loguru",
    "numpy",
    "prefect",
    "pandas",
    "plotly",
    "prophet",
    "psycopg2-binary",
    "pydantic",
    "python-dotenv",
    "scikit-learn",
    "sqlalchemy",
    "streamlit",
    "uvicorn",
]


[project.optional-dependencies]
dev = [
    "black",
    "pytest",
    "PyYAML",
    "ruff",
]


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]
include = ["eoip*"]


[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | htmlcov
  | migrations
)/
'''


[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "htmlcov",
    "migrations",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = []


[tool.ruff.lint.isort]
known-first-party = ["eoip"]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


[tool.coverage.run]
branch = true
source = ["eoip"]
omit = [
    "tests/*",
]


[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
exclude = [
    "^\\.venv/",
    "^build/",
    "^dist/",
]

